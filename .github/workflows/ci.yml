name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      force_frontend_deploy:
        description: 'Rebuild unchanged frontend after a deliberate environment/settings change (master only)'
        type: boolean
        default: false
      public_landing_only:
        description: 'Deploy the public landing page while retaining private dashboard containment (owner, master only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      PUBLIC_LANDING_ONLY: ${{ inputs.public_landing_only || false }}
      FORCE_FRONTEND_DEPLOY: ${{ inputs.force_frontend_deploy || false }}
    steps:
      - name: Validate mutually exclusive release inputs and public scope
        shell: bash
        run: |
          set -euo pipefail
          case "$PUBLIC_LANDING_ONLY:$FORCE_FRONTEND_DEPLOY" in
            false:false|false:true|true:false) ;;
            *) echo '::error::Invalid or conflicting release inputs'; exit 1 ;;
          esac
          if [[ "$PUBLIC_LANDING_ONLY" == true ]]; then
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/master ||
                  "$GITHUB_REPOSITORY_ID" != 1199906339 || "$GITHUB_ACTOR_ID" != 76501505 ]]; then
              echo '::error::Public landing release scope is not authorized'
              exit 1
            fi
          fi
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned secret scanner
        uses: ./.github/actions/install-gitleaks
      - name: Scan tracked tree and every incoming commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/tracked-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tracked-source"
          gitleaks dir "$RUNNER_TEMP/tracked-source" --config .gitleaks.toml --redact=100 --no-banner
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            range="-1 $HEAD_SHA"
          fi
          gitleaks git . --log-opts="$range" --config .gitleaks.toml --redact=100 --no-banner
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sportsbet
      DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:postgres@localhost:5432/sportsbet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install uv==0.11.32
      - run: uv sync --locked --extra dev
      - run: uv run --locked pytest -q
      - run: uv tool run pip-audit==2.10.1 --path .venv/lib/python3.12/site-packages --skip-editable
      - run: uv tool run bandit==1.9.4 -r src ops/provision_waitlist.py -q -ll -ii
      - run: uv run --locked alembic upgrade head --sql > /tmp/migrations.sql
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --test ../.github/scripts/tests/*.test.mjs
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sportsbet
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sportsbet
      DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:postgres@localhost:5432/sportsbet
      SPORTSBET_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sportsbet
      SPORTSBET_PRIVATE_ACCESS_TEST_URL: postgresql://postgres:postgres@localhost:5432/sportsbet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install uv==0.11.32
      - run: uv sync --locked --extra dev
      - run: uv run --locked pytest tests/test_migrations.py -q
      - run: uv run --locked alembic upgrade head
      - run: uv run --locked pytest tests/test_schema.py tests/test_hosted_storage.py tests/test_worker_postgres.py tests/test_cfb_supplement_postgres.py tests/test_cfb_revision_postgres.py tests/test_nfl_supplement_postgres.py tests/test_nfl_primary_revision_postgres.py tests/test_ngs_partition_postgres.py tests/test_nba_participation_postgres.py tests/test_injury_context_postgres.py tests/test_db_access.py tests/test_forecast_pages_postgres.py tests/test_private_waitlist_postgres.py tests/test_waitlist_provision.py -q
      - name: Verify locked migration-only environment against local schema
        env:
          PSYCOPG_IMPL: python
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/migrations-venv" uv sync --locked --only-group migrations
          "$RUNNER_TEMP/migrations-venv/bin/alembic" current --check-heads
          # Exercise the real direct-script import using only migration dependencies.
          # Missing configuration must fail closed before any database access.
          env -u DATABASE_URL "$RUNNER_TEMP/migrations-venv/bin/python" -I - <<'PY'
          import contextlib, io, json, runpy, sys
          stdout, stderr = io.StringIO(), io.StringIO()
          sys.argv = ['production-transaction-preflight.py']
          with contextlib.redirect_stdout(stdout), contextlib.redirect_stderr(stderr):
              try:
                  runpy.run_path('.github/scripts/production-transaction-preflight.py', run_name='__main__')
              except SystemExit as error:
                  assert error.code == 1
              else:
                  raise AssertionError('Unconfigured preflight unexpectedly passed')
          assert stdout.getvalue() == ''
          lines = stderr.getvalue().splitlines()
          assert len(lines) == 2
          assert json.loads(lines[0]) == {
              'schema_version': 1, 'diagnostic_kind': 'operation_failure',
              'operation': 'hosted_preflight', 'stage': 'config', 'error_type': 'KeyError',
          }
          assert lines[1] == 'Hosted transaction-pool schema/read preflight failed'
          print('Migration-only preflight import and configuration failure verified')
          PY
          # A separate isolated interpreter must load the waitlist diagnostics too.
          env -u DATABASE_URL GITHUB_ACTIONS=false "$RUNNER_TEMP/migrations-venv/bin/python" -I - <<'PY'
          import contextlib, io, json, runpy, sys
          stdout, stderr = io.StringIO(), io.StringIO()
          sys.argv = ['ops/provision_waitlist.py']
          with contextlib.redirect_stdout(stdout), contextlib.redirect_stderr(stderr):
              try:
                  runpy.run_path('ops/provision_waitlist.py', run_name='__main__')
              except SystemExit as error:
                  assert error.code == 1
              else:
                  raise AssertionError('Unprotected waitlist provisioner unexpectedly passed')
          assert stdout.getvalue() == ''
          lines = stderr.getvalue().splitlines()
          assert len(lines) == 2
          assert json.loads(lines[0]) == {
              'schema_version': 1, 'diagnostic_kind': 'operation_failure',
              'operation': 'waitlist_provision', 'stage': 'context', 'error_type': 'ProvisionError',
          }
          assert lines[1] == 'Private waitlist provisioning stopped: Protected master production context required'
          print('Migration-only waitlist import and protected-context failure verified')
          PY
  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify default-deny container context
        run: |
          mkdir -p .local/secrets
          printf 'context-boundary-test' > .env
          printf 'context-boundary-test' > .local/secrets/context.json
          printf 'context-boundary-test' > src/sportsbet/context-secret.json
          printf 'context-boundary-test' > src/sportsbet/context-secret.key
          printf 'context-boundary-test' > src/sportsbet/arbitrage/context-secret.json
          printf 'context-boundary-test' > certs/context-secret.pem
          docker build --file - --output "type=local,dest=$RUNNER_TEMP/worker-context" . <<'DOCKERFILE'
          FROM scratch
          COPY . /
          DOCKERFILE
          for path in .env .local .git frontend src/sportsbet/context-secret.json \
            src/sportsbet/context-secret.key src/sportsbet/arbitrage/context-secret.json certs/context-secret.pem; do
            if test -e "$RUNNER_TEMP/worker-context/$path"; then
              echo "::error::Forbidden build context path: $path"
              exit 1
            fi
          done
          test -f "$RUNNER_TEMP/worker-context/src/sportsbet/daily.py"
          test -f "$RUNNER_TEMP/worker-context/certs/supabase-prod-ca-2021.crt"
      - name: Build locked worker image
        run: docker build --file Dockerfile.worker --tag sportsbet-worker:test .
      - name: Exercise isolated worker and native solver
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --tmpfs /app/.local:rw,nosuid,nodev,uid=10001,gid=10001,size=128m \
            --volume "$PWD/tests/worker_image_smoke.py:/checks/smoke.py:ro" \
            sportsbet-worker:test python /checks/smoke.py
  production-schema:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.force_frontend_deploy == true || (github.event_name == 'workflow_dispatch' && inputs.public_landing_only == true && inputs.force_frontend_deploy != true && github.repository_id == '1199906339' && github.actor_id == '76501505'))
    needs: [release-inputs, secrets, backend, frontend, postgres, worker-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PSYCOPG_IMPL: python
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install uv==0.11.32
      - run: uv sync --locked --only-group migrations
      - name: Plan hosted schema using restricted transaction reader
        id: schema
        run: .venv/bin/python .github/scripts/production-transaction-preflight.py --plan-schema
      - name: Verify owner migration credential is configured when required
        if: steps.schema.outputs.migration_needed == 'true'
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: test -n "$DATABASE_MIGRATION_URL"
      - name: Apply reviewed migrations when hosted schema is behind
        if: steps.schema.outputs.migration_needed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: .venv/bin/alembic upgrade head
      - name: Verify hosted schema is at the application head
        run: .venv/bin/python .github/scripts/production-transaction-preflight.py --require-schema
      - name: Verify pending hosted transaction-pool read path
        run: .venv/bin/python .github/scripts/production-transaction-preflight.py
      - name: Provision and verify dedicated waitlist credential without rotation
        env:
          # Derive the writer from the dashboard identity, not the ingestion worker.
          DATABASE_URL: ${{ secrets.DASHBOARD_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: .venv/bin/python ops/provision_waitlist.py
  release-plan:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [release-inputs, secrets, backend, frontend, postgres, worker-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      FORCE_FRONTEND_DEPLOY: ${{ inputs.force_frontend_deploy || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Compare current source with the live production deployment
        id: plan
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node .github/scripts/deployment-plan.mjs
  deploy:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.force_frontend_deploy == true)
    needs: [release-inputs, secrets, backend, frontend, postgres, worker-image, production-schema, release-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # production-schema already verifies the actual restricted transaction-pool read.
      # Hold the live app closed throughout every reviewed production replacement.
      - name: Attest auth settings and enforce private containment before deployment
        if: needs.release-plan.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node .github/scripts/private-dashboard-release.mjs preflight
      - if: needs.release-plan.outputs.deploy == 'true'
        run: npm install --global vercel@59.15.1
      # Only create a deployment when the live release differs or an operator
      # deliberately requests a rebuild for external environment/settings changes.
      - if: needs.release-plan.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --yes --prod --force --meta sportsbetCommit="$GITHUB_SHA" --token="$VERCEL_TOKEN"
      - name: Transition reviewed deployment from containment to owner authentication
        id: privacy_transition
        if: needs.release-plan.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRIVATE_RELEASE_RECEIPT: ${{ runner.temp }}/private-dashboard-transition.json
        run: node .github/scripts/private-dashboard-release.mjs finish
      - name: Recover privacy containment after interruption
        if: ${{ (failure() || cancelled()) && steps.privacy_transition.outcome != '' && steps.privacy_transition.outcome != 'skipped' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRIVATE_RELEASE_RECEIPT: ${{ runner.temp }}/private-dashboard-transition.json
        run: node .github/scripts/private-dashboard-release.mjs recover
      - name: Verify unchanged deployed access controls and data readiness
        if: needs.release-plan.outputs.deploy != 'true'
        env:
          DATA_PIPELINE_ENABLED: ${{ vars.DATA_PIPELINE_ENABLED }}
          PUBLIC_DATA_PIPELINE_ENABLED: ${{ vars.PUBLIC_DATA_PIPELINE_ENABLED }}
          # Vercel's production alias can briefly resolve to the previous edge deployment.
          # Cache-busted, bounded retries keep that propagation window from creating a false failure.
          PRODUCTION_VERIFY_ATTEMPTS: '12'
          PRODUCTION_VERIFY_DELAY_MS: '5000'
        run: node frontend/scripts/verify-production.mjs
  deploy-public-contained:
    if: github.event_name == 'workflow_dispatch' && inputs.public_landing_only == true && inputs.force_frontend_deploy != true && github.ref == 'refs/heads/master' && github.repository_id == '1199906339' && github.actor_id == '76501505'
    needs: [release-inputs, secrets, backend, frontend, postgres, worker-image, production-schema, release-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      checks: read
      actions: read
      pull-requests: read
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PUBLIC_LANDING_ONLY: ${{ inputs.public_landing_only }}
      FORCE_FRONTEND_DEPLOY: ${{ inputs.force_frontend_deploy || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned Vercel CLI without release credentials
        run: npm install --global vercel@59.15.1
      - name: Verify contained public release prerequisites
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTAINED_PUBLIC_RECEIPT: ${{ runner.temp }}/contained-public-release.json
        run: node .github/scripts/contained-public-release.mjs preflight
      - name: Deploy public landing with private containment retained
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --yes --prod --force --meta sportsbetCommit="$GITHUB_SHA" --token="$VERCEL_TOKEN"
      - name: Verify deployed public landing and retained private containment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTAINED_PUBLIC_RECEIPT: ${{ runner.temp }}/contained-public-release.json
        run: node .github/scripts/contained-public-release.mjs finish
