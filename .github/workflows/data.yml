name: Live paid market data
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [daily, monitor, public_daily, public_monitor, scan, watch, refresh, backfill]
        default: daily
      sport:
        type: choice
        options: [both, all, nfl, nba, cfb]
        default: both
      provider:
        description: 'Provider for watch only; leave all for other operations'
        type: choice
        options: [all, sportsbook, kalshi, prizepicks]
        default: all
      event_ids:
        description: 'Optional comma-separated exact provider event IDs for a targeted scan'
        type: string
        default: ''
  schedule:
    # The $0 private-hosted budget permits a few pregame opportunities, not
    # half-hour jobs all day. Credit, reserve and source gates remain unchanged.
    - cron: '17 12 * * *'
    # Keep three scan opportunities/day. Sunday slots precede the NFL lock;
    # Monday's late slot covers the Monday night game without extra jobs.
    - cron: '19 0,16,20 * * 2-5'
    # A later Saturday slot retains the late FBS prelock opportunity.
    - cron: '19 0,16 * * 6'
    - cron: '55 23 * * 6'
    - cron: '35 15 * * 0'
    - cron: '45 18 * * 0'
    - cron: '19 0,16 * * 1'
    - cron: '45 22 * * 0,1'
    # Free NFL history/NGS recovery after nflverse's 07:00 UTC poll.
    - cron: '29 10 * * 2,5'
permissions:
  contents: read
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  update:
    # Enable only after database migration/backfill and provider-budget verification.
    if: >-
      github.ref == 'refs/heads/master' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.schedule == '17 12 * * *' && vars.DATA_PIPELINE_ENABLED == 'true') ||
        github.event.schedule == '29 10 * * 2,5' ||
        (vars.DATA_PIPELINE_ENABLED == 'true' && (
          github.event.schedule == '19 0,16,20 * * 2-5' ||
          github.event.schedule == '19 0,16 * * 6' ||
          github.event.schedule == '55 23 * * 6' ||
          github.event.schedule == '35 15 * * 0' ||
          github.event.schedule == '45 18 * * 0' ||
          github.event.schedule == '19 0,16 * * 1' ||
          github.event.schedule == '45 22 * * 0,1'
        ))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SPORT: ${{ inputs.sport || (github.event.schedule == '29 10 * * 2,5' && 'nfl' || (github.event.schedule == '17 12 * * *' || vars.DATA_PIPELINE_ENABLED == 'true') && 'all' || 'both') }}
      # The daily run refreshes history and settlements. Three pregame slots
      # run the quota-aware all-sport scanner when recommendations are enabled.
      OPERATION: ${{ inputs.operation || (github.event.schedule == '17 12 * * *' && 'daily' || github.event.schedule == '29 10 * * 2,5' && 'refresh' || (vars.DATA_PIPELINE_ENABLED == 'true' && 'scan' || 'monitor')) }}
      PROVIDER: ${{ inputs.provider || 'all' }}
      EVENT_IDS: ${{ inputs.event_ids || '' }}
      DAILY_CREDIT_LIMIT: ${{ vars.ODDS_DAILY_CREDIT_LIMIT || '20' }}
      ODDS_ROLLING_CREDIT_LIMIT: ${{ vars.ODDS_ROLLING_CREDIT_LIMIT || '450' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install uv==0.11.32
      - run: uv sync --locked
      - name: Check worker configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
          ODDS_API_KEY: ${{ (env.OPERATION == 'daily' || env.OPERATION == 'monitor' || env.OPERATION == 'scan' || (env.OPERATION == 'watch' && (env.PROVIDER == 'all' || env.PROVIDER == 'sportsbook'))) && secrets.ODDS_API_KEY || '' }}
        run: |
          test -n "$DATABASE_URL" && test -n "$DATABASE_URL_ASYNC" || {
            echo 'Configure the database repository secrets before running market updates.'
            exit 1
          }
          if [ "$PROVIDER" != all ] && [ "$OPERATION" != watch ]; then
            echo 'Provider selection is supported only for watch operations.'
            exit 1
          fi
          if [ -n "$EVENT_IDS" ] && { [ "$OPERATION" != scan ] || [ "$SPORT" = both ] || [ "$SPORT" = all ]; }; then
            echo 'Targeted events require a single-sport scan operation.'
            exit 1
          fi
          if [ "$SPORT" = cfb ] && [ "$OPERATION" != watch ] && [ "$OPERATION" != scan ] && [ "$OPERATION" != refresh ] && [ "$OPERATION" != backfill ] && [ "$OPERATION" != daily ] && [ "$OPERATION" != monitor ]; then
            echo 'CFB supports paid daily, monitor, scan, watch, and history refresh operations.'
            exit 1
          fi
          if [ "$SPORT" = all ] && [ "$OPERATION" != daily ] && [ "$OPERATION" != monitor ] && [ "$OPERATION" != scan ]; then
            echo 'All-sport collection supports paid daily, monitor, and scan operations.'
            exit 1
          fi
          if [ "$SPORT" = cfb ] && [ "$PROVIDER" != sportsbook ] && [ "$PROVIDER" != all ]; then
            echo 'CFB currently supports only a manual watch operation with the sportsbook provider.'
            exit 1
          fi
          case "$OPERATION:$PROVIDER" in
            daily:*|monitor:*|scan:*|watch:all|watch:sportsbook)
              test -n "$ODDS_API_KEY" || { echo 'Configure the odds repository secret for this operation.'; exit 1; } ;;
          esac
      - name: Verify hosted schema is at the application head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --locked alembic current --check-heads
      - name: Collect live market data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
          ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ (env.OPERATION == 'daily' || env.OPERATION == 'monitor' || env.OPERATION == 'scan' || (env.OPERATION == 'watch' && (env.PROVIDER == 'all' || env.PROVIDER == 'sportsbook'))) && secrets.ODDS_API_KEY || '' }}
        run: |
          set +e
          case "$OPERATION" in
            daily|monitor|public_daily|public_monitor) uv run --locked python -m sportsbet.daily --sport "$SPORT" --mode "$OPERATION" --daily-credit-limit "$DAILY_CREDIT_LIMIT" ;;
            scan)
              target=()
              if [ -n "$EVENT_IDS" ]; then
                IFS=',' read -ra ids <<< "$EVENT_IDS"
                for id in "${ids[@]}"; do target+=(--event-id "$id"); done
              fi
              uv run --locked python -m sportsbet.scan --sport "$SPORT" --daily-credit-limit "$DAILY_CREDIT_LIMIT" "${target[@]}" ;;
            watch) uv run --locked python -m sportsbet.market_watch --sport "$SPORT" --provider "$PROVIDER" --daily-credit-limit "$DAILY_CREDIT_LIMIT" --publish ;;
            refresh) uv run --locked python -m sportsbet.refresh --sport "$SPORT" ;;
            backfill) uv run --locked python -m sportsbet.refresh --sport "$SPORT" --backfill ;;
            *) exit 1 ;;
          esac
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo '::warning title=Live data coverage is degraded::The worker completed and published an honest degraded report. Inspect this step and the dashboard coverage endpoints for the unavailable provider, model, or market.'
            {
              echo '### Live data collection: degraded coverage'
              echo ''
              echo 'The worker completed and published its report, but one or more requested providers, models, or markets were incomplete. This is an operational coverage warning; CI tests and deployment are separate workflows.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"
      - name: Update source-backed player profiles
        if: env.SPORT != 'cfb' && (env.OPERATION == 'daily' || env.OPERATION == 'refresh' || env.OPERATION == 'backfill')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
        run: |
          profile_sport="$SPORT"
          if [ "$SPORT" = all ]; then profile_sport=both; fi
          uv run --locked python -m sportsbet.player_profiles --sport "$profile_sport"
      - name: Retain private prospective NFL receiving audit
        if: env.OPERATION == 'daily' && (env.SPORT == 'both' || env.SPORT == 'all' || env.SPORT == 'nfl')
        timeout-minutes: 5
        continue-on-error: true
        env:
          ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --locked python -m sportsbet.quant.nfl_receiving_checkpoint
      - name: Evaluate prospective NFL market edge privately
        if: env.OPERATION == 'daily' && (env.SPORT == 'both' || env.SPORT == 'all' || env.SPORT == 'nfl')
        timeout-minutes: 10
        env:
          ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          private_dir="$(mktemp -d "${RUNNER_TEMP}/private-edge.XXXXXXXX")"
          trap 'rm -rf "$private_dir"' EXIT
          uv run --locked python -m sportsbet.quant.priced_market_audit \
            --sport nfl --model-version empirical-jeffreys-v4 \
            --captured-after 2026-09-23T00:34:15+00:00 \
            > "$private_dir/all-forecasts.json"
          uv run --locked python -m sportsbet.quant.priced_market_audit \
            --sport nfl --model-version empirical-jeffreys-v4 \
            --recommendations-only \
            --captured-after 2026-09-23T00:34:15+00:00 \
            > "$private_dir/recommendations.json"
          PRIVATE_EDGE_DIR="$private_dir" uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          from sportsbet.quant.nfl_priced_checkpoint import build_report, store_report

          root = Path(os.environ['PRIVATE_EDGE_DIR'])
          reports = {
              label: json.loads((root / filename).read_text(encoding='utf8'))
              for label, filename in (
                  ('All forecasts', 'all-forecasts.json'),
                  ('Recommendations', 'recommendations.json'),
              )
          }
          try:
              store_report(os.environ['ANALYTICS_DATABASE_URL'], build_report(reports))
          except Exception as exc:
              raise SystemExit(f'Private prospective NFL market evaluation unavailable: {type(exc).__name__}') from None
          print('Private prospective NFL market evaluation retained')
          PY
      - name: Retain current NFL model priced evidence privately
        if: env.OPERATION == 'daily' && (env.SPORT == 'both' || env.SPORT == 'all' || env.SPORT == 'nfl')
        timeout-minutes: 10
        env:
          ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          private_dir="$(mktemp -d "${RUNNER_TEMP}/current-nfl-edge.XXXXXXXX")"
          trap 'rm -rf "$private_dir"' EXIT
          uv run --locked python -m sportsbet.quant.nfl_history_edge --output "$private_dir/current.json"
          PRIVATE_EDGE_DIR="$private_dir" uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          from sportsbet.quant.nfl_history_checkpoint import build_report, store_report

          root = Path(os.environ['PRIVATE_EDGE_DIR'])
          result = json.loads((root / 'current.json').read_text(encoding='utf8'))['nfl']
          try:
              store_report(os.environ['ANALYTICS_DATABASE_URL'], build_report(result))
          except Exception as exc:
              raise SystemExit(f'Current NFL model priced evaluation unavailable: {type(exc).__name__}') from None
          print('Current NFL model priced evaluation retained')
          PY
      - name: Retain current NBA and CFB priced evidence privately
        if: env.OPERATION == 'daily'
        timeout-minutes: 5
        env:
          ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          case "$SPORT" in
            all) audit_sport=all ;;
            both|nba) audit_sport=nba ;;
            cfb) audit_sport=cfb ;;
            *) exit 0 ;;
          esac
          uv run --locked python -m sportsbet.quant.current_multisport_checkpoint --sport "$audit_sport"
      - name: Stage public evidence without configured credentials
        if: always() && (env.OPERATION == 'watch' || env.OPERATION == 'daily' || env.OPERATION == 'monitor' || env.OPERATION == 'public_daily' || env.OPERATION == 'public_monitor' || env.OPERATION == 'refresh' || env.OPERATION == 'scan')
        id: evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
          ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ (env.OPERATION == 'daily' || env.OPERATION == 'monitor' || env.OPERATION == 'scan' || (env.OPERATION == 'watch' && (env.PROVIDER == 'all' || env.PROVIDER == 'sportsbook'))) && secrets.ODDS_API_KEY || '' }}
        run: uv run --locked python -m sportsbet.ingestion.public_artifacts --output "$RUNNER_TEMP/public-evidence"
      - name: Install checksum-pinned secret scanner
        if: always() && steps.evidence.outcome == 'success'
        id: scanner
        uses: ./.github/actions/install-gitleaks
      - name: Scan public evidence
        if: always() && steps.evidence.outcome == 'success' && steps.scanner.outcome == 'success'
        id: evidence_scan
        run: gitleaks dir "$RUNNER_TEMP/public-evidence" --config .gitleaks.toml --redact=100 --no-banner
      - name: Report local-only raw evidence
        if: always() && steps.evidence.outcome == 'success'
        run: |
          {
            echo '### Raw evidence: local only'
            echo 'Raw source files remain on the runner filesystem; no artifact or release upload is performed.'
            echo 'GitHub-hosted runner storage is ephemeral. No durable raw backup is created by this workflow.'
            echo 'Owner-local scheduled paper captures retain their separate verified local recovery packages and hash-only pregame anchors.'
          } >> "$GITHUB_STEP_SUMMARY"
