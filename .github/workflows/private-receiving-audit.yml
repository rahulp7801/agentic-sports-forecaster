name: Private NFL receiving audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-nfl-receiving-audit
  cancel-in-progress: false
jobs:
  retain:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install uv==0.11.32
      - run: uv sync --locked
      - name: Verify private worker schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo 'Restricted database secret is missing'; exit 1; }
          uv run --locked alembic current --check-heads
      - name: Retain frozen prospective audit
        env:
          ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --locked python -m sportsbet.quant.nfl_receiving_checkpoint
