name: Public market data
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [public_monitor, public_daily]
        default: public_monitor
      sport:
        type: choice
        options: [both, nfl, nba, cfb]
        default: both
  schedule:
    # Private GitHub-hosted minutes are finite under the $0 stop-usage budget.
    # Sixteen attempts/day span UTC by 90 minutes; delayed/dropped runs remain
    # visible as stale data. Daily source/receipt work uses two existing slots.
    - cron: '7 0,3,6,9,15,18,21 * * *'
    - cron: '7 12 * * *'
    - cron: '37 1,4,7,10,16,19,22 * * *'
    - cron: '37 13 * * *'
permissions:
  contents: read
concurrency:
  group: public-market-data
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || vars.PUBLIC_DATA_PIPELINE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SPORT: ${{ inputs.sport || 'both' }}
      OPERATION: ${{ inputs.operation || ((github.event.schedule == '7 12 * * *' || github.event.schedule == '37 13 * * *') && 'public_daily' || 'public_monitor') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: pip install uv==0.11.32
      - run: uv sync --locked
      - name: Check worker configuration
        id: worker_config
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
        run: |
          test -n "$DATABASE_URL" && test -n "$DATABASE_URL_ASYNC" || {
            echo 'Configure the database repository secrets before running public updates.'
            exit 1
          }
      - name: Verify hosted schema is at the application head
        id: schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --locked alembic current --check-heads
      - name: Stage free NFL source receipts before the next market capture
        if: env.OPERATION == 'public_daily' && (env.SPORT == 'both' || env.SPORT == 'nfl')
        continue-on-error: true
        run: uv run --locked python -m sportsbet.quant.kalshi_pair_sources --output-dir "$RUNNER_TEMP/nfl-role-sources"
      - name: Update public market data
        if: env.SPORT != 'cfb'
        id: public_update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
          ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KALSHI_PAIR_SOURCE_DIR: ${{ runner.temp }}/nfl-role-sources
          KALSHI_PAIR_OUTPUT: ${{ runner.temp }}/private-kalshi-pair/pair.json
        run: |
          set -euo pipefail
          report_dir="$(mktemp -d "$RUNNER_TEMP/public-report.XXXXXXXX")"
          report_path="$report_dir/report.json"
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          set +e
          uv run --locked python -m sportsbet.daily --sport "$SPORT" --mode "$OPERATION" --report-output "$report_path"
          status=$?
          set -e
          if [ "$status" -eq 0 ] || [ "$status" -eq 2 ]; then
            if ! uv run --locked python .github/scripts/validate-public-report.py \
              --report "$report_path" --mode "$OPERATION" --sport "$SPORT" \
              --producer-status "$status" --started-at "$started_at"; then
              if [ "$status" -eq 0 ]; then exit 1; fi
              exit "$status"
            fi
            printf 'report_ready=true\nreport_path=%s\n' "$report_path" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Update CFB schedule without consuming odds credits
        if: always() && !cancelled() && steps.worker_config.outcome == 'success' && steps.schema.outcome == 'success' && (github.event_name == 'schedule' || env.SPORT == 'cfb')
        id: cfb_schedule
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --locked python -m sportsbet.schedules --sport cfb --report-output "$RUNNER_TEMP/cfb-slate-report.json"
      - name: Verify exact published CFB slate receipt
        if: always() && !cancelled() && steps.cfb_schedule.outcome == 'success'
        env:
          PUBLIC_DATA_REPORT_PATH: ${{ runner.temp }}/cfb-slate-report.json
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --locked python .github/scripts/verify-published-snapshots.py
      - name: Settle CFB from free final sources
        if: always() && !cancelled() && steps.worker_config.outcome == 'success' && steps.schema.outcome == 'success' && env.OPERATION == 'public_daily' && (env.SPORT == 'both' || env.SPORT == 'cfb')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
          ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --locked python -m sportsbet.cfb_public_settlement
      - name: Update source-backed player profiles
        if: always() && !cancelled() && steps.worker_config.outcome == 'success' && steps.schema.outcome == 'success' && env.SPORT != 'cfb' && env.OPERATION == 'public_daily'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
        run: uv run --locked python -m sportsbet.player_profiles --sport "$SPORT"
      - name: Verify private access and published snapshot receipt
        if: always() && !cancelled() && steps.worker_config.outcome == 'success' && steps.schema.outcome == 'success' && ((env.SPORT != 'cfb' && steps.public_update.outputs.report_ready == 'true') || (env.SPORT == 'cfb' && steps.cfb_schedule.outcome == 'success'))
        env:
          DATA_PIPELINE_ENABLED: 'false'
          PUBLIC_DATA_PIPELINE_ENABLED: 'true'
          PUBLIC_DATA_REPORT_PATH: ${{ steps.public_update.outputs.report_path }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Preserve exact capture identity while bounded CDN/server caches refresh.
          # Retry only mismatched public captures, without repeating collection.
          PUBLIC_CAPTURE_VERIFY_ATTEMPTS: '37'
          PUBLIC_CAPTURE_VERIFY_DELAY_MS: '5000'
          # Retry a briefly unavailable deployed endpoint, never collection.
          # Persistent 503s still fail the readiness gate after three reads.
          PUBLIC_READINESS_503_ATTEMPTS: '3'
          PUBLIC_READINESS_503_DELAY_MS: '5000'
        run: |
          if [ "$SPORT" != cfb ]; then
            uv run --locked python .github/scripts/verify-published-snapshots.py
          fi
          PUBLIC_DATA_REPORT_PATH= node frontend/scripts/verify-production.mjs
      - name: Stage public evidence without configured provider credentials
        if: always()
        id: evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
          ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --locked python -m sportsbet.ingestion.public_artifacts --output "$RUNNER_TEMP/public-evidence"
      - name: Install checksum-pinned secret scanner
        if: always() && steps.evidence.outcome == 'success'
        id: scanner
        uses: ./.github/actions/install-gitleaks
      - name: Scan public evidence
        if: always() && steps.evidence.outcome == 'success' && steps.scanner.outcome == 'success'
        id: evidence_scan
        run: gitleaks dir "$RUNNER_TEMP/public-evidence" --config .gitleaks.toml --redact=100 --no-banner
      - name: Scan private NFL paired receipt and sources
        if: always() && steps.evidence_scan.outcome == 'success' && env.OPERATION == 'public_daily'
        id: private_scan
        run: |
          if test -f "$RUNNER_TEMP/private-kalshi-pair/pair.json"; then
            gitleaks dir "$RUNNER_TEMP/private-kalshi-pair" --config .gitleaks.toml --redact=100 --no-banner
            gitleaks dir "$RUNNER_TEMP/nfl-role-sources" --config .gitleaks.toml --redact=100 --no-banner
          fi
      - name: Report local-only raw evidence
        if: always() && steps.evidence.outcome == 'success'
        run: |
          {
            echo '### Raw evidence: local only'
            echo 'Raw source files and research pairs remain on the runner filesystem; no artifact or release upload is performed.'
            echo 'GitHub-hosted runner storage is ephemeral. No durable raw backup is created by this workflow.'
            echo 'Owner-local scheduled paper captures retain their separate verified local recovery packages and hash-only pregame anchors.'
          } >> "$GITHUB_STEP_SUMMARY"
