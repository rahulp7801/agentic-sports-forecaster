name: Public market data
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [public_monitor, public_daily]
        default: public_monitor
      sport:
        type: choice
        options: [both, nfl, nba, cfb]
        default: both
      retain_evidence:
        description: 'Upload a replay artifact (uses account artifact storage)'
        type: boolean
        default: false
  schedule:
    - cron: '17 13 * * *'
    - cron: '47 13 * * *'
    # GitHub schedules are best-effort. The second pair provides recovery
    # opportunities inside the dashboard's 90-minute freshness window.
    - cron: '7,37 * * * *'
    - cron: '22,52 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: public-market-data
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || vars.PUBLIC_DATA_PIPELINE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SPORT: ${{ inputs.sport || 'both' }}
      OPERATION: ${{ inputs.operation || ((github.event.schedule == '17 13 * * *' || github.event.schedule == '47 13 * * *') && 'public_daily' || 'public_monitor') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: pip install uv==0.11.32
      - run: uv sync --locked
      - name: Check worker configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
        run: |
          test -n "$DATABASE_URL" && test -n "$DATABASE_URL_ASYNC" || {
            echo 'Configure the database repository secrets before running public updates.'
            exit 1
          }
      - name: Verify hosted schema is at the application head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --locked alembic current --check-heads
      - name: Stage free NFL source receipts before the next market capture
        if: env.OPERATION == 'public_daily' && (env.SPORT == 'both' || env.SPORT == 'nfl')
        continue-on-error: true
        run: uv run --locked python -m sportsbet.quant.kalshi_pair_sources --output-dir "$RUNNER_TEMP/nfl-role-sources"
      - name: Update public market data
        if: env.SPORT != 'cfb'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
          ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KALSHI_PAIR_SOURCE_DIR: ${{ runner.temp }}/nfl-role-sources
          KALSHI_PAIR_OUTPUT: ${{ runner.temp }}/private-kalshi-pair/pair.json
        run: uv run --locked python -m sportsbet.daily --sport "$SPORT" --mode "$OPERATION" --report-output "$RUNNER_TEMP/public-report.json"
      - name: Update CFB schedule without consuming odds credits
        if: github.event_name == 'schedule' || env.SPORT == 'cfb'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --locked python -m sportsbet.schedules --sport cfb
      - name: Update source-backed player profiles
        if: env.SPORT != 'cfb' && env.OPERATION == 'public_daily'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
        run: uv run --locked python -m sportsbet.player_profiles --sport "$SPORT"
      - name: Verify deployed public readiness
        if: env.SPORT != 'cfb'
        env:
          DATA_PIPELINE_ENABLED: 'false'
          PUBLIC_DATA_PIPELINE_ENABLED: 'true'
          PUBLIC_DATA_REPORT_PATH: ${{ runner.temp }}/public-report.json
          # Preserve exact capture identity while bounded CDN/server caches refresh.
          # Retry only mismatched public captures, without repeating collection.
          PUBLIC_CAPTURE_VERIFY_ATTEMPTS: '37'
          PUBLIC_CAPTURE_VERIFY_DELAY_MS: '5000'
        run: node frontend/scripts/verify-production.mjs
      - name: Stage public evidence without configured provider credentials
        if: always()
        id: evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
          ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --locked python -m sportsbet.ingestion.public_artifacts --output "$RUNNER_TEMP/public-evidence"
      - name: Install checksum-pinned secret scanner
        if: always() && steps.evidence.outcome == 'success'
        id: scanner
        uses: ./.github/actions/install-gitleaks
      - name: Scan public evidence
        if: always() && steps.evidence.outcome == 'success' && steps.scanner.outcome == 'success'
        id: evidence_scan
        run: gitleaks dir "$RUNNER_TEMP/public-evidence" --config .gitleaks.toml --redact=100 --no-banner
      - name: Scan private NFL paired receipt and sources
        if: always() && steps.evidence_scan.outcome == 'success' && env.OPERATION == 'public_daily'
        id: private_scan
        run: |
          if test -f "$RUNNER_TEMP/private-kalshi-pair/pair.json"; then
            gitleaks dir "$RUNNER_TEMP/private-kalshi-pair" --config .gitleaks.toml --redact=100 --no-banner
            gitleaks dir "$RUNNER_TEMP/nfl-role-sources" --config .gitleaks.toml --redact=100 --no-banner
          fi
      - name: Pack private replayable NFL pair
        if: always() && steps.private_scan.outcome == 'success'
        id: private_pack
        run: |
          if test -f "$RUNNER_TEMP/private-kalshi-pair/pair.json"; then
            uv run --locked python -m sportsbet.quant.kalshi_pair_artifact \
              --pair "$RUNNER_TEMP/private-kalshi-pair/pair.json" \
              --source-dir "$RUNNER_TEMP/nfl-role-sources" \
              --market-dir .local/market-watch \
              --output "$RUNNER_TEMP/private-kalshi-pair.zip"
            echo 'packaged=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check private pair artifact storage budget
        if: always() && steps.private_pack.outputs.packaged == 'true'
        id: private_storage_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/artifact_storage_gate.py --candidate "$RUNNER_TEMP/private-kalshi-pair.zip" --reserve-bytes 25000000
      - name: Retain private model and market pair
        if: always() && steps.private_storage_gate.outputs.retain == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-nfl-pair-${{ github.run_id }}
          path: ${{ runner.temp }}/private-kalshi-pair.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Pack verified public evidence losslessly
        if: always() && steps.evidence_scan.outcome == 'success'
        id: evidence_pack
        run: uv run --locked python -m sportsbet.ingestion.pack_public_artifacts --input "$RUNNER_TEMP/public-evidence" --output "$RUNNER_TEMP/public-evidence.tar.xz"
      # Fifteen-minute monitor captures update the dashboard; retaining each one
      # would exceed the shared free artifact allowance. Keep daily raw samples.
      - name: Check repository artifact storage budget
        if: always() && steps.evidence_pack.outcome == 'success' && steps.evidence_pack.outputs.packaged == 'true' && ((github.event_name == 'schedule' && env.OPERATION == 'public_daily') || (github.event_name == 'workflow_dispatch' && inputs.retain_evidence == true))
        id: storage_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          reserve=0
          if test "$OPERATION" = public_daily; then reserve=25000000; fi
          python .github/scripts/artifact_storage_gate.py \
            --candidate "$RUNNER_TEMP/public-evidence.tar.xz" --reserve-bytes "$reserve"
      - name: Retain public market evidence for replay
        if: always() && steps.evidence_pack.outcome == 'success' && steps.evidence_pack.outputs.packaged == 'true' && steps.storage_gate.outputs.retain == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-market-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/public-evidence.tar.xz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
