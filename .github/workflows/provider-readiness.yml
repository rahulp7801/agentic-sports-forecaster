name: Read-only provider readiness
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.repository == 'rahulp7801/agentic-sports-forecaster'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install uv==0.11.32
      - run: uv sync --locked
      - name: Inspect provider acceptance and existing credit ledger without quotes
        env:
          ANALYTICS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DAILY_CREDIT_LIMIT: ${{ vars.ODDS_DAILY_CREDIT_LIMIT || '20' }}
          ODDS_ROLLING_CREDIT_LIMIT: ${{ vars.ODDS_ROLLING_CREDIT_LIMIT || '450' }}
        run: uv run --locked python -m sportsbet.provider_readiness --daily-credit-limit "$DAILY_CREDIT_LIMIT"
